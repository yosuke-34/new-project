<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>題簽・背ラベル・落款</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

:root {
  --ink: #1f1c1a;     /* 墨 */
  --sub: #6b645c;     /* 鈍色 */
  --line: #a9a196;
  --faint: #d6cfc4;
  --dot: #cfc8bd;
  --shu: #b7282e;     /* 朱 */
  --mincho: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  --gothic: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif;
}

@page { margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: var(--mincho); color: var(--ink); background: #8f8a84; }

.page {
  position: relative;
  width: 210mm; height: 297mm;
  overflow: hidden;
  background: #fff;
  break-after: page;
}
.page.a3 { width: 420mm; height: 297mm; }
@media screen {
  body { padding: 10mm 0; }
  .page { margin: 0 auto 10mm; box-shadow: 0 2mm 6mm rgba(0,0,0,.25); }
}

.abs { position: absolute; }
.g { font-family: var(--gothic); }
.sub { color: var(--sub); }

/* ---------- 共通パーツ ---------- */
.lbl { font-family: var(--gothic); font-size: 6.6pt; color: var(--sub); letter-spacing: .05em; white-space: nowrap; }
.field { display: flex; align-items: flex-end; gap: 1.6mm; border-bottom: .25mm solid var(--line); height: 100%; padding-bottom: .9mm; }
.field .lbl { flex: none; }
.field .fill { flex: 1; }
.field .unit { font-family: var(--gothic); font-size: 7pt; color: var(--sub); white-space: nowrap; }
.chk { font-family: var(--gothic); font-size: 7.2pt; white-space: nowrap; }
.chk::before { content: ''; display: inline-block; width: 2.6mm; height: 2.6mm; border: .25mm solid var(--ink); margin: 0 .8mm -.35mm 0; }
.circle-opts { font-family: var(--gothic); font-size: 7.4pt; line-height: 2.1; word-spacing: .2em; }
.circle-opts span { margin-right: 2.2mm; white-space: nowrap; }

/* 爪（小口の区分タブ） */
.tab {
  position: absolute; width: 14mm;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-family: var(--gothic); font-weight: 500; font-size: 9.5pt; letter-spacing: .3em;
  writing-mode: vertical-rl;
}
.tab.right { right: 0; padding-left: 3mm; }
.tab.left { left: 0; padding-right: 3mm; }
.tab .n { font-family: var(--mincho); font-weight: 800; font-size: 10pt; margin-bottom: 1.5mm; letter-spacing: 0; }

/* ラベル貼り付け枠 */
.mount {
  position: absolute;
  background-image: radial-gradient(circle, var(--dot) .22mm, transparent .3mm);
  background-size: 10mm 10mm;
  background-position: center center;
}
.mount .c { position: absolute; width: 6mm; height: 6mm; border-color: var(--ink); border-style: solid; border-width: 0; }
.mount .c.tl { left: 0; top: 0; border-left-width: .3mm; border-top-width: .3mm; }
.mount .c.tr { right: 0; top: 0; border-right-width: .3mm; border-top-width: .3mm; }
.mount .c.bl { left: 0; bottom: 0; border-left-width: .3mm; border-bottom-width: .3mm; }
.mount .c.br { right: 0; bottom: 0; border-right-width: .3mm; border-bottom-width: .3mm; }
.mount .m { position: absolute; background: var(--line); }
.mount .m.t, .mount .m.b { left: 50%; width: .25mm; height: 3mm; }
.mount .m.t { top: -1.5mm; } .mount .m.b { bottom: -1.5mm; }
.mount .m.l, .mount .m.r { top: 50%; height: .25mm; width: 3mm; }
.mount .m.l { left: -1.5mm; } .mount .m.r { right: -1.5mm; }
.mount .hint { position: absolute; left: 3mm; bottom: 2.4mm; font-family: var(--gothic); font-size: 6.2pt; color: #b3aba0; letter-spacing: .08em; }
.mount .fold { position: absolute; top: -4mm; bottom: -4mm; left: 50%; border-left: .25mm dashed var(--line); }

/* ヘッダー（台紙） */
.hdr { position: absolute; display: flex; align-items: flex-end; gap: 4mm; height: 11mm; }
.no { display: flex; align-items: flex-end; gap: 1.4mm; flex: none; }
.no .k { font-family: var(--mincho); font-weight: 600; font-size: 11pt; letter-spacing: .04em; }
.no .box { width: 21mm; height: 9mm; border-bottom: .45mm solid var(--ink); }
.no .pfx { font-family: var(--mincho); font-weight: 800; font-size: 14pt; line-height: 1; margin-bottom: .6mm; }
.chip { display: inline-flex; align-items: center; gap: 1.2mm; font-family: var(--gothic); font-size: 7pt; color: var(--sub); white-space: nowrap; }
.chip i { display: inline-block; width: 3mm; height: 3mm; border-radius: 50%; }
.foot { position: absolute; bottom: 7mm; display: flex; justify-content: space-between; font-family: var(--gothic); font-size: 6.4pt; color: #a49c91; letter-spacing: .12em; }

/* 記録欄 */
.rec { position: absolute; }
.rec .row { display: flex; gap: 4mm; height: 8.6mm; }
.rec .row > div { height: 100%; }
.rec h4 { font-family: var(--gothic); font-weight: 500; font-size: 7pt; color: var(--sub); letter-spacing: .15em; margin-bottom: 1.2mm; }
.taste { position: relative; width: 36mm; height: 36mm; border: .25mm solid var(--line);
  background-image: linear-gradient(var(--faint) .2mm, transparent .2mm), linear-gradient(90deg, var(--faint) .2mm, transparent .2mm);
  background-size: 9mm 9mm; background-position: -.1mm -.1mm; }
.taste::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; border-left: .3mm solid var(--line); }
.taste::after { content: ''; position: absolute; top: 50%; left: 0; right: 0; border-top: .3mm solid var(--line); }
.taste .ax { position: absolute; font-family: var(--gothic); font-size: 6.4pt; color: var(--sub); white-space: nowrap; }
.stars { font-size: 15pt; letter-spacing: 1.2mm; color: var(--ink); line-height: 1; }
.lines { background-image: linear-gradient(transparent calc(100% - .25mm), var(--line) calc(100% - .25mm)); background-size: 100% 7.6mm; }

/* 表 */
table.idx { border-collapse: collapse; width: 100%; table-layout: fixed; }
table.idx th { font-family: var(--gothic); font-weight: 500; font-size: 6.8pt; color: var(--sub); letter-spacing: .1em; text-align: left; padding: 0 1.2mm 1.4mm; border-bottom: .45mm solid var(--ink); }
table.idx td { height: 9.05mm; border-bottom: .25mm solid var(--faint); padding: 0 1.2mm; font-size: 8pt; vertical-align: middle; }
table.idx td.num { font-family: var(--mincho); font-weight: 600; font-size: 9pt; color: var(--ink); letter-spacing: .05em; }
table.idx td.rg { border-left: .25mm solid var(--faint); border-right: .25mm solid var(--faint); }
table.idx td.st { font-size: 7.4pt; color: #b7b0a5; letter-spacing: .4mm; }
table.idx tr.ms td.num { color: var(--shu); }

/* 見出し */
.pagetitle { font-family: var(--mincho); font-weight: 800; font-size: 20pt; letter-spacing: .3em; }
.pagetitle small { font-family: var(--gothic); font-weight: 400; font-size: 7.4pt; letter-spacing: .3em; color: var(--sub); margin-left: 4mm; vertical-align: middle; }
.rule { border-top: .45mm solid var(--ink); }
.rule.thin { border-top-width: .25mm; }

.prose { font-size: 9.6pt; line-height: 1.95; letter-spacing: .03em; }
.prose h3 { font-weight: 800; font-size: 11.5pt; letter-spacing: .14em; margin: 5mm 0 1.5mm; }
.prose h3 .num { display: inline-block; min-width: 7mm; color: var(--shu); }
.prose p { margin-bottom: 1.4mm; text-align: justify; }
.prose .note { font-family: var(--gothic); font-size: 7.6pt; line-height: 1.8; color: var(--sub); }
.steps { list-style: none; counter-reset: s; }
.steps li { position: relative; padding-left: 9mm; margin-bottom: 2.4mm; counter-increment: s; }
.steps li::before { content: counter(s, cjk-ideographic); position: absolute; left: 0; top: 0; font-weight: 800; color: var(--shu); }
.panel { border: .25mm solid var(--line); padding: 3mm 4mm; }

@page { size: A4 portrait; }</style></head>
